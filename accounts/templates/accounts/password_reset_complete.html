
{% extends 'accounts/base.html' %}

{% block title %}Password Updated | IdeaBloom{% endblock %}

{% block content %}

<style>
    .success-container {
        max-width: 480px;
        margin: 70px auto;
        padding: 0 15px;
    }

    .success-card {
        padding: 42px 35px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow);
    }

    .success-icon {
        width: 75px;
        height: 75px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 22px;
        border-radius: 50%;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: white;
        font-size: 35px;
    }

    .success-card h2 {
        color: var(--text);
        font-size: 25px;
        font-weight: 800;
        margin-bottom: 12px;
    }

    .success-card p {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.8;
        margin-bottom: 27px;
    }

    .login-btn {
        display: inline-block;
        padding: 13px 28px;
        border-radius: 10px;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: white;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 7px 18px rgba(99, 102, 241, 0.3);
    }

    @media (max-width: 500px) {
        .success-card {
            padding: 32px 22px;
        }
    }
</style>

<div class="success-container">

    <div class="card success-card">

        <div class="success-icon">
            ✓
        </div>

        <h2>Password Updated!</h2>

        <p>
            Your password has been successfully changed.
            You can now log in to your IdeaBloom account
            using your new password.
        </p>

        <a href="{% url 'login' %}" class="login-btn">
            Login Now →
        </a>

    </div>

</div>

{% endblock %}
