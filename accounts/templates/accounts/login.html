
{% extends 'accounts/base.html' %}

{% block title %}Login | IdeaBloom{% endblock %}

{% block content %}

<style>
    .login-wrapper {
        max-width: 460px;
        margin: 45px auto;
        padding: 0 12px;
    }

    .login-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 38px;
        box-shadow: var(--shadow);
    }

    .login-icon {
        width: 62px;
        height: 62px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: white;
        font-size: 29px;
    }

    .login-heading {
        text-align: center;
        color: var(--text);
        font-size: 30px;
        font-weight: 800;
        margin-bottom: 9px;
        letter-spacing: -0.7px;
    }

    .login-description {
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 30px;
        line-height: 1.6;
    }

    .login-card form p {
        margin-bottom: 18px;
    }

    .login-card label {
        display: block;
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .login-card input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--surface-secondary);
        color: var(--text);
        font-size: 14px;
        box-sizing: border-box;
    }

    .login-card input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    .login-card .helptext {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-top: 6px;
    }

    .login-card .errorlist {
        color: #ef4444;
        font-size: 13px;
        padding-left: 18px;
        margin-bottom: 8px;
    }

    .login-submit {
        width: 100%;
        margin-top: 8px;
        padding: 13px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: white;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .login-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 7px 18px rgba(99, 102, 241, 0.3);
    }

    .login-links {
        text-align: center;
        margin-top: 23px;
        font-size: 14px;
        line-height: 1.8;
    }

    .login-links a {
        color: var(--primary);
        font-weight: 700;
        text-decoration: none;
    }

    .login-links a:hover {
        text-decoration: underline;
    }

    .login-divider {
        border: none;
        border-top: 1px solid var(--border);
        margin: 20px 0;
    }

    @media (max-width: 500px) {
        .login-wrapper {
            margin: 25px auto;
        }

        .login-card {
            padding: 26px 20px;
        }

        .login-heading {
            font-size: 26px;
        }
    }
</style>

<div class="login-wrapper">

    <div class="login-card">

        <div class="login-icon">
            ✦
        </div>

        <h1 class="login-heading">
            Welcome Back
        </h1>

        <p class="login-description">
            Login to your IdeaBloom account and continue exploring ideas.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="login-submit">
                Login to Account →
            </button>
        </form>

        <div class="login-links">

            <a href="{% url 'password_reset' %}">
                Forgot password?
            </a>

            <hr class="login-divider">

            <p class="muted">
                Don't have an account?
                <a href="{% url 'register' %}">Create one</a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
